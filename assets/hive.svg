<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- HIVE mark: a hexagon (the hive) filled with the slit-scan column field
       from the visualizer, with the dark visor band across the eye line. -->
  <defs>
    <linearGradient id="col" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0a1a3a"/>
      <stop offset="45%"  stop-color="#2f8fe0"/>
      <stop offset="72%"  stop-color="#8fd4ff"/>
      <stop offset="100%" stop-color="#0a1a3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="58%">
      <stop offset="0%"   stop-color="#eaf7ff" stop-opacity="0.95"/>
      <stop offset="55%"  stop-color="#3d93e6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#04070f" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="hex">
      <path d="M64 6 L114 35 L114 93 L64 122 L14 93 L14 35 Z"/>
    </clipPath>
  </defs>

  <rect width="128" height="128" rx="24" fill="#04070f"/>
  <g clip-path="url(#hex)">
    <rect x="14" y="6" width="100" height="116" fill="#061024"/>
    <circle cx="64" cy="56" r="42" fill="url(#glow)"/>
    <g fill="url(#col)">
      <rect x="20"  y="18"  width="5" height="92" opacity="0.35"/>
      <rect x="28"  y="10"  width="5" height="108" opacity="0.5"/>
      <rect x="36"  y="22"  width="5" height="84"  opacity="0.7"/>
      <rect x="44"  y="8"   width="5" height="112" opacity="0.85"/>
      <rect x="52"  y="16"  width="5" height="96"  opacity="1"/>
      <rect x="60"  y="4"   width="5" height="120" opacity="1"/>
      <rect x="68"  y="14"  width="5" height="100" opacity="1"/>
      <rect x="76"  y="8"   width="5" height="112" opacity="0.85"/>
      <rect x="84"  y="24"  width="5" height="80"  opacity="0.7"/>
      <rect x="92"  y="12"  width="5" height="104" opacity="0.5"/>
      <rect x="100" y="20"  width="5" height="88"  opacity="0.35"/>
    </g>
    <!-- visor -->
    <rect x="14" y="52" width="100" height="15" fill="#02040a" opacity="0.92"/>
    <rect x="14" y="52" width="100" height="1.6" fill="#4fb3ff" opacity="0.8"/>
    <g fill="#7fc9ff" opacity="0.75">
      <rect x="22" y="57" width="7"  height="2.4"/>
      <rect x="32" y="57" width="4"  height="2.4"/>
      <rect x="39" y="57" width="10" height="2.4"/>
      <rect x="52" y="57" width="5"  height="2.4"/>
      <rect x="60" y="57" width="8"  height="2.4"/>
    </g>
    <g fill="#ff4b56" opacity="0.8">
      <rect x="74" y="57" width="9"  height="2.4"/>
      <rect x="86" y="57" width="5"  height="2.4"/>
      <rect x="94" y="57" width="11" height="2.4"/>
    </g>
  </g>
  <path d="M64 6 L114 35 L114 93 L64 122 L14 93 L14 35 Z"
        fill="none" stroke="#4fb3ff" stroke-width="3" stroke-linejoin="round" opacity="0.9"/>
</svg>
