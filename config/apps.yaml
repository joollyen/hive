# What "open X" resolves to.
#
# Two layers. This file holds explicit aliases for things Jay actually says, with
# the phrasings a person uses out loud ("the browser", "my vault", "a new doc")
# rather than the names in the app menu. Anything not listed here falls through to
# a runtime scan of every .desktop file on the system, fuzzy-matched on Name.
# So this file does not need to be exhaustive — it needs to be right about the
# twenty things that get opened every day.

browsers:
  default: chrome
  chrome:
    exec: ["google-chrome-stable"]
    new_window: ["google-chrome-stable", "--new-window"]
    app_mode: ["google-chrome-stable", "--app={url}"]
  firefox:
    exec: ["firefox"]
    new_window: ["firefox", "--new-window"]

apps:
  chrome:
    aliases: ["chrome", "google chrome", "browser", "the browser", "web browser"]
    desktop: "google-chrome.desktop"
    exec: ["google-chrome-stable"]
    new_window: ["google-chrome-stable", "--new-window"]
  firefox:
    aliases: ["firefox", "fire fox", "mozilla"]
    exec: ["firefox"]
    new_window: ["firefox", "--new-window"]
  tor:
    aliases: ["tor", "tor browser", "onion browser"]
    desktop: "start-tor-browser.desktop"
  vscode:
    aliases: ["vs code", "vscode", "visual studio code", "code", "the editor", "my editor"]
    exec: ["code"]
    new_window: ["code", "--new-window"]
  obsidian:
    aliases: ["obsidian", "my vault", "the vault", "my notes", "notes app"]
    desktop: "md.obsidian.Obsidian.desktop"
    exec: ["flatpak", "run", "md.obsidian.Obsidian"]
  claude_desktop:
    aliases: ["claude desktop", "claude app", "the claude app"]
    desktop: "com.anthropic.Claude.desktop"
  terminal:
    aliases: ["terminal", "the terminal", "console", "shell", "ptyxis", "command line"]
    desktop: "org.gnome.Ptyxis.desktop"
    exec: ["ptyxis"]
  files:
    aliases: ["files", "file manager", "nautilus", "file browser", "explorer"]
    desktop: "org.gnome.Nautilus.desktop"
    exec: ["nautilus"]
  spotify:
    aliases: ["spotify", "music", "my music"]
    exec: ["spotify"]
  obs:
    aliases: ["obs", "obs studio", "streaming", "recorder"]
    desktop: "com.obsproject.Studio.desktop"
  flameshot:
    aliases: ["flameshot", "screenshot", "screen shot", "snip", "capture"]
    desktop: "org.flameshot.Flameshot.desktop"
    exec: ["flameshot", "gui"]
  btop:
    aliases: ["btop", "system monitor", "resource monitor", "task manager", "top"]
    desktop: "btop.desktop"
  calculator:
    aliases: ["calculator", "calc"]
    desktop: "org.gnome.Calculator.desktop"
  texteditor:
    aliases: ["text editor", "gedit", "notepad"]
    desktop: "org.gnome.TextEditor.desktop"
  settings:
    aliases: ["settings", "system settings", "preferences", "control panel"]
    desktop: "org.gnome.Settings.desktop"
  vpn:
    aliases: ["vpn", "proton vpn", "protonvpn"]
    desktop: "proton.vpn.app.gtk.desktop"
  steam:
    aliases: ["steam", "my games", "games"]
    desktop: "steam.desktop"
  vlc:
    aliases: ["vlc", "video player", "media player"]
    desktop: "vlc.desktop"
  libreoffice:
    aliases: ["libreoffice", "libre office", "office"]
    desktop: "libreoffice-startcenter.desktop"

# Spoken-name -> URL. This is the "open a new google doc for me" path, and the
# .new shortcuts matter: they create the document directly instead of landing on
# a file list that then needs a click.
web:
  google_doc:
    aliases: ["google doc", "google docs", "new doc", "a doc", "a document",
              "new document", "word doc", "docs"]
    url: "https://docs.new"
  google_sheet:
    aliases: ["google sheet", "google sheets", "spreadsheet", "new sheet", "excel"]
    url: "https://sheets.new"
  google_slides:
    aliases: ["google slides", "slides", "presentation", "powerpoint", "slide deck"]
    url: "https://slides.new"
  claude:
    aliases: ["claude", "new claude chat", "claude chat", "a new claude",
              "claude conversation"]
