  gmail:
    aliases: ["gmail", "my email", "email", "mail", "inbox"]
    url: "https://mail.google.com"
  calendar:
    aliases: ["calendar", "my calendar", "google calendar", "my schedule", "schedule"]
    url: "https://calendar.google.com"
  drive:
    aliases: ["drive", "google drive", "my drive", "cloud storage"]
    url: "https://drive.google.com"
  github:
    aliases: ["github", "git hub", "my repos", "repositories"]
