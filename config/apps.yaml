# --- searchable sites -------------------------------------------------------
# "open YouTube and type X into the search bar" resolves here. The spoken
# aliases live in hive/cognition/intents.py (_SEARCH_SITES) because the grammar
# has to match them; this file holds where they point, because that is the half
# that changes when a site reorganises its URLs.
#
# `{q}` is URL-encoded. `read: true` means the results are worth speaking back —
# a shopping or reference search where the answer is the list. `read: false`
# means open the page and stop talking: reading six video titles aloud to
# someone who asked for a browser tab is noise, not service.
#
# `domain` is what a `site:` search is restricted to. Every large retailer
# refuses an unattended client — Best Buy answers a plain fetch with a bot
# check, not a product list — so prices are read off the search index and the
# retailer's own page is opened alongside for stock and delivery.
search_sites:
  youtube:
    aliases: ["youtube", "you tube"]
    url: "https://www.youtube.com/results?search_query={q}"
    domain: "youtube.com"
    read: false
  bestbuy:
    aliases: ["best buy", "bestbuy"]
    url: "https://www.bestbuy.com/site/searchpage.jsp?st={q}"
    domain: "bestbuy.com"
    read: true
  amazon:
    aliases: ["amazon"]
    url: "https://www.amazon.com/s?k={q}"
    domain: "amazon.com"
    read: true
  newegg:
    aliases: ["newegg", "new egg"]
    url: "https://www.newegg.com/p/pl?d={q}"
    domain: "newegg.com"
    read: true
  ebay:
    aliases: ["ebay", "e bay"]
    url: "https://www.ebay.com/sch/i.html?_nkw={q}"
    domain: "ebay.com"
    read: true
  walmart:
    aliases: ["walmart", "wal mart"]
    url: "https://www.walmart.com/search?q={q}"
    domain: "walmart.com"
    read: true
  microcenter:
    aliases: ["micro center", "microcenter"]
    url: "https://www.microcenter.com/search/search_results.aspx?Ntt={q}"
    domain: "microcenter.com"
    read: true
  google:
    aliases: ["google"]
    url: "https://www.google.com/search?q={q}"
    domain: ""
    read: false
  wikipedia:
    aliases: ["wikipedia"]
    url: "https://en.wikipedia.org/w/index.php?search={q}"
    domain: "wikipedia.org"
    read: true
  reddit:
    aliases: ["reddit"]
    url: "https://www.reddit.com/search/?q={q}"
    domain: "reddit.com"
    read: true
  github:
    aliases: ["github", "git hub"]
    url: "https://github.com/search?q={q}&type=repositories"
    domain: "github.com"
    read: true
  stackoverflow:
    aliases: ["stack overflow", "stackoverflow"]
    url: "https://stackoverflow.com/search?q={q}"
    domain: "stackoverflow.com"
    read: true
  arxiv:
    aliases: ["arxiv", "archive x"]
    url: "https://arxiv.org/abs/?searchtype=all&query={q}"
    domain: "arxiv.org"
    read: true
  scholar:
    aliases: ["google scholar", "scholar"]
    url: "https://scholar.google.com/scholar?q={q}"
    domain: ""
    read: false
  hackernews:
    aliases: ["hacker news"]
    url: "https://hn.algolia.com/?q={q}"
    domain: "news.ycombinator.com"
    read: true
  exploitdb:
    aliases: ["exploit db", "exploitdb"]
    url: "https://www.exploit-db.com/search?q={q}"
    domain: "exploit-db.com"
    read: true
